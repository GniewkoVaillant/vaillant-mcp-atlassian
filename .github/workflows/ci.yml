# The point of this workflow is to run what nobody runs locally. Everyone here
# develops on Linux with a current Node, so a matrix that only repeated that
# would cost minutes and tell us nothing. The two axes that carry information:
#
#   macos-latest - the whole attachment-safety layer (realpath, O_NOFOLLOW,
#                  O_NONBLOCK, st_nlink, /private symlinking of the temp dir)
#                  behaves differently on Darwin. attachmentSecurity.test.ts
#                  even carries a comment about macOS resolving the temporary
#                  directory through /private, and until now nothing executed
#                  that branch.
#   node 18      - package.json declares "engines": { "node": ">=18" }. That
#                  claim has never been tested.
name: ci

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
          cache: npm

      # `npm ci` runs `prepare` (-> build:dist), so the install already compiles
      # the package the way a consumer installing from git would. That is not
      # waste to be optimised away with --ignore-scripts: it is the regression
      # test for the "package cannot be installed from git" finding, and the
      # only place the tsconfig.build.json path is exercised at all.
      - run: npm ci

      # Descending ceiling. 93 is the current count of no-explicit-any warnings
      # in the Data Center response-parsing layer (0 errors). Lower this number
      # as the debt is paid off; never raise it. Raising it is how a warning
      # budget stops meaning anything.
      - run: npx eslint . --max-warnings 93

      # Second compile, deliberately: `prepare` builds via tsconfig.build.json,
      # which excludes src/__tests__, and the unit suite runs against the
      # compiled dist/__tests__/*.test.js. Without this step there is nothing to
      # run. tsc on this tree takes a couple of seconds.
      - run: npm run build

      # --experimental-test-coverage landed in Node 18.15.0; the `18` line
      # resolves to 18.20.x, so both matrix versions support it (verified
      # against 18.20.8). Coverage is reported, not gated - there is no
      # threshold to trip over, the numbers are here to be read.
      - run: node --test --experimental-test-coverage dist/__tests__/*.test.js

      # Boots the built server over stdio and inspects tools/list. It supplies
      # its own placeholder credentials and never contacts a real instance
      # unless ATLASSIAN_SMOKE_LIVE=true, which CI does not set.
      - run: npm run test:smoke

      # The destructive surface is a registration branch that the default smoke
      # run cannot see: it asserts that the six delete tools are absent. Run it
      # once more with the opt-in so the other half of that assertion - exactly
      # six delete tools present, and nothing else - is checked too.
      - run: npm run test:smoke
        env:
          ATLASSIAN_ALLOW_DESTRUCTIVE: 'true'

      # Verifies the published file list: dist without dist/__tests__ and
      # without source maps. Also runs `prepare` a third time, which is the
      # cheapest way to confirm packing does not depend on a dirty tree.
      - run: npm pack --dry-run
